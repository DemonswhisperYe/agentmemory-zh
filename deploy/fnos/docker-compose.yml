# agentmemory（rohitg00）单容器部署 — 飞牛 NAS
# 官方 deploy/coolify 模板的等价版 + 中文分词补装 + viewer 开到局域网
services:
  agentmemory:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AGENTMEMORY_VERSION: "0.9.30"
        III_VERSION: "0.22.1"
        III_SDK_VERSION: "0.22.1"
    container_name: agentmemory
    restart: unless-stopped
    ports:
      - "3111:3111"   # REST/MCP：Agent 接入口
      - "3112:3112"   # 流式通道（viewer 实时刷新用）
      - "3113:3113"   # 管理界面（官方只绑容器内 localhost，这里开到局域网）
    environment:
      # viewer 对外开放时官方强制要求 HMAC 密钥鉴权（首启自动生成，存 /data/.hmac）
      AGENTMEMORY_VIEWER_HOST: "0.0.0.0"
      # viewer 对外开放还要求 Host 头白名单（防 DNS 重绑定）
      VIEWER_ALLOWED_HOSTS: "localhost:3113,127.0.0.1:3113,192.168.31.128:3113"
      # 直接指定引擎配置，绕过 CLI 自带的配置生成逻辑（0.9.30 的生成器会把
      # allowed_origins 拼成重复块导致 YAML 解析失败）
      AGENTMEMORY_III_CONFIG: "/data/iii-config.engine.yaml"
      III_VIEWER_PORT: "3113"
      III_REST_PORT: "3111"
      III_STREAM_PORT: "3112"
      # ===== LLM：CPA 反代（OpenAI 兼容）=====
      OPENAI_API_KEY: "sk-REPLACE_WITH_YOUR_LLM_KEY"   # 本机真实密钥不要提交
      OPENAI_BASE_URL: "http://192.168.31.128:8317/v1"
      OPENAI_MODEL: "agnes-3.0-flash"
      AGENTMEMORY_LLM_TIMEOUT_MS: "120000"   # LLM 长尾延迟常超 60s 默认预算，放宽到 120s
      # ===== 向量：Ollama 的 OpenAI 兼容 embeddings 端点（现用中文向量模型）=====
      OPENAI_EMBEDDING_API_KEY: "ollama"   # Ollama 不校验密钥，占位非空即可
      OPENAI_EMBEDDING_BASE_URL: "http://192.168.31.128:11434/v1"
      OPENAI_EMBEDDING_MODEL: "shaw/dmeta-embedding-zh"
      OPENAI_EMBEDDING_DIMENSIONS: "768"   # dmeta 是 768 维，不声明会被按默认 1536 算导致维度不匹配
      AGENTMEMORY_VECTOR_BACKFILL: "all"   # 开启存量文档向量回填（默认暂停）
      GRAPH_EXTRACTION_ENABLED: "true"      # LLM 抽取知识图谱
      AGENTMEMORY_AUTO_COMPRESS: "true"     # LLM 压缩观测记录
      AGENTMEMORY_INJECT_CONTEXT: "true"    # 召回记忆注入 agent 对话
    volumes:
      - ./data:/data
      - ./iii-config.engine.yaml:/data/iii-config.engine.yaml
      # 官方要求的密钥文件（提供方识别只认这个文件，不认进程环境变量）
      - ./agentmemory.env:/home/node/.agentmemory/.env:ro
    # 引擎会在配置文件旁的 config/ 里落运行期种子配置；tmpfs 保证每次重启从
    # 配置文件重新生成（官方 compose 同款做法）
    tmpfs:
      - /data/config:mode=01777
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3111/agentmemory/livez || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
